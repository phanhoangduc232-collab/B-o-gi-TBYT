# Render Blueprint - cho phep tao Web Service + Disk chi bang 1 lan bam "Apply"
# Cach dung: xem huong dan chi tiet trong README.md (muc "Cach 1: Deploy bang Render Blueprint")
services:
  - type: web
    name: Baogiatest
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    disk:
      name: Baogiatest
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /tmp
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUBMISSION_OPEN_AT
        value: "2026-08-19T10:00:00"
      - key: SUBMISSION_CLOSE_AT
        value: "2026-08-19T16:00:00"
      - key: GOI_THAU_TEN
        value: "Mua sắm TBYT đợt III "
      - key: YCBG_SO
        value: "2717/YCBG-BVE ngày 14/7/2026"
      - key: MAX_CONTENT_LENGTH_MB
        value: "25"
