services:
  - type: web
    name: Baogiatest
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATA_DIR
        value: "/tmp/data"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUBMISSION_OPEN_AT
        value: "2026-08-01T00:00:00"
      - key: SUBMISSION_CLOSE_AT
        value: "2026-08-31T23:59:59"
      - key: GOI_THAU_TEN
        value: "Mua sắm TBYT đợt III"
      - key: VCBC_SO
        value: "2717/YCBG-BVE ngày 14/7/2026"
      - key: YCBG_SO
        value: "2717/YCBG-BVE ngày 14/7/2026"
      - key: MAX_CONTENT_LENGTH_MB
        value: "25"
